steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ss-scraper:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ss-scraper:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy ss-scraper \
          --image gcr.io/$PROJECT_ID/ss-scraper:$SHORT_SHA \
          --region=us-central1 --platform=managed --allow-unauthenticated \
          --set-secrets TELEGRAM_WEBHOOK_SECRET=projects/$PROJECT_ID/secrets/TELEGRAM_WEBHOOK_SECRET:latest,DB_URL=projects/$PROJECT_ID/secrets/DB_URL:latest,TELEGRAM_BOT_TOKEN=projects/$PROJECT_ID/secrets/TELEGRAM_BOT_TOKEN:latest,TELEGRAM_CHAT_ID=projects/$PROJECT_ID/secrets/TELEGRAM_CHAT_ID:latest

images:
  - 'gcr.io/$PROJECT_ID/ss-scraper:$SHORT_SHA'

timeout: '1200s'
